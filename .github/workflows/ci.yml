name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run docs:api
      - run: npm test
      - run: npm run build

  regras:
    # Regras do Firestore no emulador: cada papel tentando o que pode e o que não pode.
    name: regras do Firestore
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run test:regras

  e2e:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  qa-automacao:
    # Suíte do repositório rj-bank-qa-automation contra este código, já compilado.
    name: automação de QA
    runs-on: ubuntu-latest
    needs: check
    env:
      BASE_URL: http://localhost:4173
      EXTERNAL_APIS: mock
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: RafaelRJesus/rj-bank-qa-automation
          path: qa
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            qa/package-lock.json
      - run: npm ci
      - name: sobe o app (sem Firebase)
        run: |
          npm run build -- --mode e2e
          npx vite preview --port 4173 --strictPort &
          for i in $(seq 30); do curl -sf http://localhost:4173 >/dev/null && exit 0; sleep 2; done; exit 1
      - name: roda a automação
        working-directory: qa
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test --project=oraculo --project=ui-desktop --project=ui-mobile
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: relatorio-qa-automacao
          path: |
            qa/playwright-report/
            qa/test-results/
          retention-days: 14
