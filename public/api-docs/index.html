<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Respawn: documentação das APIs</title>
    <link rel="stylesheet" href="./vendor/swagger-ui.css" />
    <style>
      body {
        margin: 0;
        background: #f6f7fa;
      }
      .topo {
        display: flex;
        align-items: center;
        gap: 1rem;
        max-width: 1460px;
        margin: 0 auto;
        padding: 1rem 20px;
        font: 600 15px/1.4 system-ui, sans-serif;
        color: #111827;
      }
      .topo a {
        color: #2d33b8;
      }
      .topo span {
        margin-left: auto;
        font-weight: 400;
        color: #5b6473;
      }
      .swagger-ui .topbar {
        display: none;
      }
      .swagger-ui .btn.execute,
      .swagger-ui .btn.authorize {
        border-color: #3a3fd8;
        color: #3a3fd8;
      }
      .swagger-ui .btn.execute {
        background: #3a3fd8;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <header class="topo">
      Respawn: APIs
      <a href="/">Voltar ao app</a>
      <span>Projeto de estudo: use apenas dados fictícios.</span>
    </header>
    <div id="swagger"></div>
    <script src="./vendor/swagger-ui-bundle.js"></script>
    <script>
      window.ui = SwaggerUIBundle({
        url: './openapi.yaml',
        dom_id: '#swagger',
        deepLinking: true,
        docExpansion: 'list',
        defaultModelsExpandDepth: 1,
        tryItOutEnabled: false,
        persistAuthorization: false,
      })
    </script>
  </body>
</html>
